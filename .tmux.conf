# Change prefix from Ctrl+b to Ctrl+a (easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Split panes with | and - (more intuitive)
bind | split-window -h
bind - split-window -v

# Switch panes with Alt+arrow (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Mouse support
set -g mouse on

# Start windows from 1 not 0
set -g base-index 1

# Better colors
set -g default-terminal "xterm-256color"

# Bigger scrollback
set -g history-limit 10000


# Brown status bar
set -g status-style "bg=#8B6B4A,fg=#FFFFFF"

# Pane divider (the green vertical line) to match
set -g pane-active-border-style "fg=#8B6B4A"
set -g pane-border-style "fg=#BFBFBF"
