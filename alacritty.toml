[general]
live_config_reload = true

[terminal.shell]
program = "wsl.exe"
args = ["-d", "Ubuntu", "--cd", "~/dev"]

[window]
padding.x = 10
padding.y = 10
opacity = 1.0

[font]
size = 15

[font.normal]
family = "MS Gothic fix"

[font.bold]
family = "MS Gothic fix"

[font.italic]
family = "MS Gothic fix"

[scrolling]
history = 10000

[cursor]
style.shape = "Block"
style.blinking = "On"
blink_interval = 500
unfocused_hollow = true

[env]
TERM = "xterm-256color"

# Mostly monochrome with muted accents
[colors.primary]
background = "#FFFFFF"
foreground = "#000000"

[colors.cursor]
text = "#FFFFFF"
cursor = "#000000"

[colors.selection]
text = "#000000"
background = "#DCE6F2"

[colors.normal]
black   = "#000000"
red     = "#B4504B"
green   = "#5E8A4F"
yellow  = "#A68A2E"
blue    = "#4A6FA5"
magenta = "#8B5E94"
cyan    = "#3F8A8C"
white   = "#BFBFBF"

[colors.bright]
black   = "#4D4D4D"
red     = "#D0645E"
green   = "#74A664"
yellow  = "#C2A13A"
blue    = "#5E87C2"
magenta = "#A674B0"
cyan    = "#52A3A6"
white   = "#E6E6E6"
